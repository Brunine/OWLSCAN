[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owlscan"
version = "2.0.0"
description = "Internal pentest network-segmentation scanner — Masscan discovery + Nmap full/deep scan with evasion profiles and honeypot detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OwlScan Maintainers" }
]
keywords = ["pentest", "nmap", "masscan", "network", "security", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "loguru>=0.7",
    "tomli>=2.0; python_version < \"3.11\"",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]

[project.scripts]
owlscan = "owlscan.cli:main"

[tool.setuptools.packages.find]
include = ["owlscan*"]